<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" width="20" height="20" role="img" aria-label="">
  <style>
    svg{--fg:#FFFFFF}
    @media (prefers-color-scheme: light){ svg{--fg:#0A0A0A} }
    .fg{fill:var(--fg)} .st{stroke:var(--fg);fill:none}
  </style>
  <circle class="st" cx="10" cy="10" r="4" stroke-width="1.3">
    <animate attributeName="r" values="4;9" dur="2.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0" dur="2.2s" repeatCount="indefinite"/>
  </circle>
  <circle class="fg" cx="10" cy="10" r="4">
    <animate attributeName="r" values="4;5;4" dur="2.2s" repeatCount="indefinite"/>
  </circle>
</svg>
