<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 880 280" width="880" height="280" role="img"
     aria-label="EwEE - Fullstack Developer">

  <style>
    svg{--bg:#0A0A0A;--fg:#FFFFFF;--line:#262626;--muted:#8A8A8A;--dim:#555555;--haze:#FFFFFF}
    @media (prefers-color-scheme: light){
      svg{--bg:#FFFFFF;--fg:#0A0A0A;--line:#E2E2E2;--muted:#666666;--dim:#9A9A9A;--haze:#000000}
    }
    .bg{fill:var(--bg)}
    .fg{fill:var(--fg)}
    .muted{fill:var(--muted)}
    .dim{fill:var(--dim)}
    .haze{fill:var(--haze)}
    .ln{stroke:var(--line);fill:none}
    .lnfg{stroke:var(--fg);fill:none}
    text{font-family:ui-monospace,"JetBrains Mono","SFMono-Regular",Menlo,Consolas,"Liberation Mono",monospace}
  </style>

  <defs>
    <!-- metallic sweep: bright / dim / bright -->
    <linearGradient id="flow" gradientUnits="objectBoundingBox" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect">
      <stop offset="0"    stop-color="var(--fg)" stop-opacity="1"/>
      <stop offset="0.42" stop-color="var(--fg)" stop-opacity="0.38"/>
      <stop offset="0.58" stop-color="var(--fg)" stop-opacity="0.38"/>
      <stop offset="1"    stop-color="var(--fg)" stop-opacity="1"/>
      <animateTransform attributeName="gradientTransform" type="translate"
                        values="-0.6 0; 0.6 0; -0.6 0" dur="9s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="var(--fg)" stop-opacity="0.9"/>
      <stop offset="0.45" stop-color="var(--fg)" stop-opacity="0.35"/>
      <stop offset="1"    stop-color="var(--fg)" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="fade" cx="50%" cy="50%" r="72%">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="softmask"><rect width="880" height="280" fill="url(#fade)"/></mask>

    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0V26" stroke="var(--fg)" stroke-opacity="0.055" stroke-width="1" fill="none"/>
    </pattern>

    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="blob" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="52"/>
    </filter>
    <!-- film grain -->
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
    </filter>

    <clipPath id="card"><rect x="0" y="0" width="880" height="280" rx="16"/></clipPath>

    <path id="o1" d="M -96 0 A 96 39 0 1 1 96 0 A 96 39 0 1 1 -96 0"/>
    <path id="o2" d="M -96 0 A 96 39 0 1 1 96 0 A 96 39 0 1 1 -96 0" transform="rotate(60)"/>
    <path id="o3" d="M -96 0 A 96 39 0 1 1 96 0 A 96 39 0 1 1 -96 0" transform="rotate(120)"/>

    <clipPath id="t0"><rect x="188" y="150" height="30" width="0">
      <animate attributeName="width" begin="1.1s" dur="16s" repeatCount="indefinite"
        values="0;228;228;0;0;0;0;0;0" keyTimes="0;0.075;0.215;0.24;0.25;0.5;0.75;0.99;1"/></rect></clipPath>
    <clipPath id="t1"><rect x="188" y="150" height="30" width="0">
      <animate attributeName="width" begin="1.1s" dur="16s" repeatCount="indefinite"
        values="0;0;228;228;0;0;0;0;0" keyTimes="0;0.25;0.325;0.465;0.49;0.5;0.75;0.99;1"/></rect></clipPath>
    <clipPath id="t2"><rect x="188" y="150" height="30" width="0">
      <animate attributeName="width" begin="1.1s" dur="16s" repeatCount="indefinite"
        values="0;0;0;228;228;0;0;0;0" keyTimes="0;0.25;0.5;0.575;0.715;0.74;0.75;0.99;1"/></rect></clipPath>
    <clipPath id="t3"><rect x="188" y="150" height="30" width="0">
      <animate attributeName="width" begin="1.1s" dur="16s" repeatCount="indefinite"
        values="0;0;0;0;228;228;0;0;0" keyTimes="0;0.25;0.5;0.75;0.825;0.965;0.99;0.995;1"/></rect></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect class="bg" width="880" height="280"/>

    <!-- soft light haze -->
    <g class="haze" opacity="0.10" filter="url(#blob)">
      <circle cx="150" cy="90" r="112">
        <animate attributeName="cx" values="150;250;150" dur="17s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="90;170;90"  dur="13s" repeatCount="indefinite"/>
      </circle>
      <circle cx="700" cy="200" r="122" opacity="0.8">
        <animate attributeName="cx" values="700;610;700" dur="19s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="200;80;200"  dur="15s" repeatCount="indefinite"/>
      </circle>
      <circle cx="440" cy="250" r="96" opacity="0.5">
        <animate attributeName="cx" values="440;520;440" dur="21s" repeatCount="indefinite"/>
      </circle>
    </g>

    <g mask="url(#softmask)">
      <rect x="-30" y="-30" width="960" height="360" fill="url(#grid)">
        <animateTransform attributeName="transform" type="translate"
                          values="0 0; 26 26; 0 0" dur="14s" repeatCount="indefinite"/>
      </rect>
    </g>

    <g class="fg">
      <circle cx="92" cy="238" r="1.8">
        <animate attributeName="cy" values="238;30;238" dur="18s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;.85;0" dur="18s" repeatCount="indefinite"/>
      </circle>
      <circle cx="318" cy="252" r="1.4">
        <animate attributeName="cy" values="252;20;252" dur="23s" begin="-6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;.7;0" dur="23s" begin="-6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="512" cy="246" r="1.6">
        <animate attributeName="cy" values="246;26;246" dur="20s" begin="-12s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;.6;0" dur="20s" begin="-12s" repeatCount="indefinite"/>
      </circle>
      <circle cx="806" cy="240" r="1.5">
        <animate attributeName="cy" values="240;24;240" dur="26s" begin="-3s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;.75;0" dur="26s" begin="-3s" repeatCount="indefinite"/>
      </circle>
    </g>

    <g transform="translate(706 140)">
      <g class="ln">
        <use xlink:href="#o1" href="#o1"/>
        <use xlink:href="#o2" href="#o2"/>
        <use xlink:href="#o3" href="#o3"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="60s" repeatCount="indefinite"/>
      </g>

      <circle class="fg" r="4.8" filter="url(#soft)">
        <animateMotion dur="6s" repeatCount="indefinite"><mpath xlink:href="#o1" href="#o1"/></animateMotion>
      </circle>
      <circle class="fg" r="4" opacity="0.62" filter="url(#soft)">
        <animateMotion dur="8.5s" repeatCount="indefinite" keyPoints="0.35;1.35" keyTimes="0;1" calcMode="linear"><mpath xlink:href="#o2" href="#o2"/></animateMotion>
      </circle>
      <circle class="fg" r="4.4" opacity="0.38" filter="url(#soft)">
        <animateMotion dur="11s" repeatCount="indefinite" keyPoints="0.7;1.7" keyTimes="0;1" calcMode="linear"><mpath xlink:href="#o3" href="#o3"/></animateMotion>
      </circle>

      <circle class="lnfg" r="9" stroke-width="1.4">
        <animate attributeName="r" values="9;54" dur="3.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.55;0" dur="3.6s" repeatCount="indefinite"/>
      </circle>
      <circle class="lnfg" r="9" stroke-width="1.4">
        <animate attributeName="r" values="9;54" dur="3.6s" begin="-1.8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.55;0" dur="3.6s" begin="-1.8s" repeatCount="indefinite"/>
      </circle>
      <circle class="fg" r="9.5" filter="url(#glow)">
        <animate attributeName="r" values="9.5;11.5;9.5" dur="2.4s" repeatCount="indefinite"/>
      </circle>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.9s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="0 14" to="0 0" dur="0.9s" fill="freeze"/>
      <text x="56" y="112" font-size="80" font-weight="700" textLength="196"
            fill="url(#flow)" filter="url(#glow)">EwEE</text>
    </g>

    <rect x="56" y="130" height="2" width="0" rx="1" fill="url(#rule)">
      <animate attributeName="width" from="0" to="392" dur="1.2s" begin="0.35s" fill="freeze"/>
    </rect>

    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.9s" fill="freeze"/>
      <text class="dim" x="56" y="172" font-size="20">~/dev</text>
      <text class="fg" x="122" y="172" font-size="20" opacity="0.75">&#8250;</text>

      <g class="muted" font-size="20">
        <g clip-path="url(#t0)"><text x="188" y="172" textLength="228" lengthAdjust="spacing">Fullstack Developer</text></g>
        <g clip-path="url(#t1)"><text x="188" y="172" textLength="228" lengthAdjust="spacing">Python &amp; TypeScript</text></g>
        <g clip-path="url(#t2)"><text x="188" y="172" textLength="228" lengthAdjust="spacing">React &amp; TailwindCSS</text></g>
        <g clip-path="url(#t3)"><text x="188" y="172" textLength="228" lengthAdjust="spacing">Discord Bot Builder</text></g>
      </g>

      <rect class="fg" y="154" width="10" height="22" rx="1">
        <animate attributeName="x" begin="1.1s" dur="16s" repeatCount="indefinite"
          values="188;416;416;188;188;416;416;188;188;416;416;188;188;416;416;188;188"
          keyTimes="0;0.075;0.215;0.24;0.25;0.325;0.465;0.49;0.5;0.575;0.715;0.74;0.75;0.825;0.965;0.99;1"/>
        <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.49;0.5;0.99;1" dur="1.05s" repeatCount="indefinite"/>
      </rect>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="1.3s" fill="freeze"/>
      <rect class="ln" x="56" y="200" width="196" height="30" rx="15" stroke-width="1"/>
      <circle class="fg" cx="76" cy="215" r="4">
        <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text class="muted" x="90" y="220" font-size="13">open to collaborate</text>
    </g>

    <g class="ln" stroke-width="1.5">
      <path d="M16 40V16h24"/><path d="M864 40V16h-24"/>
      <path d="M16 240v24h24"/><path d="M864 240v24h-24"/>
    </g>

    <rect x="0" y="0" width="200" height="2" fill="url(#rule)">
      <animate attributeName="x" values="-200;880" dur="5s" repeatCount="indefinite"/>
    </rect>

    <!-- grain overlay -->
    <rect width="880" height="280" filter="url(#grain)" opacity="0.05" style="mix-blend-mode:overlay"/>
  </g>
  <rect x="0.5" y="0.5" width="879" height="279" rx="16" class="ln"/>
</svg>
